<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f2933">
<title>Металл без очереди – демо-концепт для БАРСАвтоМет</title>
<style>
:root{
  --bg:#e9edf1; --surface:#fff; --ink:#151a1f; --muted:#56616d; --line:#d9dfe6; --line-soft:#e8ecf0;
  --steel:#1f2933; --steel-2:#323f4b;
  --accent:#c33d06; --accent-ink:#fff; --accent-soft:#fdece3;
  --blue:#1c5bc4; --blue-soft:#e6eefb;
  --amber:#7a4f00; --amber-soft:#fff1cf;
  --teal:#0b6b66; --teal-soft:#dff3f1;
  --green:#1b6e3d; --green-soft:#dff3e6;
  --r:12px; --r-sm:8px;
  --ease:cubic-bezier(.22,1,.36,1);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-size:16px;line-height:1.4;background:var(--bg);-webkit-text-size-adjust:100%}
::selection{background:#f6c9b3;color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* верх: плашка и роли */
.top{position:sticky;top:0;z-index:30;background:var(--bg)}
.demo-note{background:var(--steel);color:#d6dde4;font-size:11.5px;line-height:1.3;text-align:center;padding:5px 12px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#dde3e9;max-width:430px;margin:0 auto}
.roles button{height:40px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);transition:background .2s,color .2s}
.roles button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(21,26,31,.14)}

.stage{max-width:430px;margin:0 auto;background:var(--surface);min-height:calc(100vh - 100px);box-shadow:0 0 0 1px var(--line-soft);position:relative}
.stage.chat{background:#dfe5ea}

/* шапка мини-приложения */
.tgbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--steel);color:#fff;position:sticky;top:var(--top,78px);z-index:20}
.tgbar .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.tgbar .t{flex:1;min-width:0}
.tgbar .t b{display:block;font-size:16px;line-height:1.2}
.tgbar .t span{display:block;font-size:12px;color:#aebac6;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgbar .ib{width:44px;height:44px;margin:-6px -8px -6px 0;display:grid;place-items:center;border-radius:10px;color:#fff;position:relative}
.tgbar .ib:active{background:rgba(255,255,255,.1)}
.tgbar .badge{position:absolute;top:3px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.pad{padding:14px}
.lead{padding:16px 14px 6px}
.lead h1{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.lead p{margin:6px 0 0;color:var(--muted);font-size:15px;text-wrap:pretty}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.facts li{display:flex;align-items:center;gap:5px}
.facts .i{width:16px;height:16px}

.search{display:flex;align-items:center;gap:8px;margin:12px 14px 0;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:#f6f8fa;color:var(--muted)}
.search:focus-within{border-color:var(--blue);background:#fff}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;color:var(--ink);height:100%}
.search input::placeholder{color:#6c7783}
.search button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--steel);border-color:var(--steel);color:#fff}
.src{padding:8px 14px 4px;font-size:12px;color:var(--muted);line-height:1.35}

.list{list-style:none;margin:0;padding:0}
.row{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line-soft);min-height:68px;background:#fff}
.row:active{background:#f3f5f7}
.row .main{flex:1;min-width:0}
.row .nm,.row .sp{display:block}
.row .nm{font-weight:600;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.row .sp{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.row .pr{text-align:right;flex:none}
.row .pr b{display:block;font-size:16px;white-space:nowrap}
.row .pr span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.row .add{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row.in .add{background:var(--accent);color:#fff}
.incart{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--accent)}
.more{display:block;margin:10px auto 18px;height:44px;padding:0 20px;border-radius:var(--r);border:1px solid var(--line);font-weight:600}
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* нижняя кнопка Telegram */
.main-btn{position:sticky;bottom:0;z-index:15;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0))}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:0 16px;transition:transform .15s var(--ease),background .15s}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:#cdd4db;color:#6b7580;cursor:not-allowed;transform:none}
.btn.sec{background:#eef1f4;color:var(--ink)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn .sum{margin-left:auto;font-variant-numeric:tabular-nums}
.btn.split{justify-content:space-between}

/* шторка с калькулятором */
.scrim{position:fixed;inset:0;background:rgba(21,26,31,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:#cdd4db;margin:0 auto 10px}
.sheet h2{margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#eef1f4;border-radius:10px;padding:4px;margin:14px 0 4px}
.seg button{min-height:40px;border-radius:7px;font-weight:600;font-size:14.5px;color:var(--muted);padding:0 6px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(21,26,31,.15)}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;font-size:17px;background:#fff;outline:0}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbe7fb}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{height:34px;padding:0 12px;border-radius:17px;background:#eef1f4;font-size:14px;font-weight:600}
.res{margin:14px 0 6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;font-size:15px}
.res div+div{border-top:1px solid var(--line-soft)}
.res div span:first-child{color:var(--muted)}
.res div b{font-variant-numeric:tabular-nums;text-align:right}
.res .tot{background:#f6f8fa}
.res .tot b{font-size:18px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.warn{font-size:13px;color:#8a1c1c;background:#fde8e8;border-radius:8px;padding:8px 10px;margin-top:10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:var(--r-sm);background:#eef1f4;display:grid;place-items:center}
.stepper input{width:90px;text-align:center}

/* корзина */
.h2{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:20px 14px 8px}
.crow{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line-soft)}
.crow .l{flex:1;min-width:0;text-align:left}
.crow .l b{display:block;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.crow .l span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.crow .r{text-align:right;font-weight:700;white-space:nowrap}
.crow .x{width:36px;height:36px;margin:-6px -8px -6px 0;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.totline{display:flex;justify-content:space-between;padding:14px;border-top:1px solid var(--line);font-size:17px;font-weight:700}
.opt{display:grid;gap:8px;padding:0 14px}
.opt.c2{grid-template-columns:1fr 1fr}
.card-opt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:var(--r);min-height:76px;background:#fff}
.card-opt b{font-size:15px;display:flex;align-items:center;gap:7px}
.card-opt span{font-size:12.5px;color:var(--muted);line-height:1.3}
.card-opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.card-opt.h{flex-direction:row;align-items:center;gap:10px;min-height:56px}
.card-opt.h .tx{display:flex;flex-direction:column;gap:2px}
.days{display:flex;gap:8px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.days button{flex:none;min-height:44px;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-weight:600;font-size:14px}
.days button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px 0}
.slots button{min-height:44px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.slots button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
.form{padding:0 14px;display:grid;gap:0}
.hint{padding:8px 14px 0;font-size:12.5px;color:var(--muted);line-height:1.4}
.demo-tag{display:inline-block;font-size:11px;font-weight:700;color:#5c6672;background:#eef1f4;border-radius:4px;padding:1px 6px;vertical-align:1px;white-space:nowrap}

/* принято */
.done{padding:22px 14px 8px}
.done .ok{width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.done .ok .i{width:26px;height:26px;stroke-width:2.2}
.done h1{margin:14px 0 6px;font-size:25px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.done .big{font-size:18px;line-height:1.35;margin:0;text-wrap:pretty}
.done .big b{color:var(--accent)}
.steps{list-style:none;margin:18px 0 0;padding:0}
.steps li{position:relative;display:flex;gap:12px;padding:0 0 18px 0;font-size:15px}
.steps li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;color:#fff}
.steps .dot .i{width:14px;height:14px;stroke-width:3}
.steps li.on .dot{background:var(--green);border-color:var(--green)}
.steps li.on::before{background:var(--green)}
.steps li.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps .tx b{display:block;font-weight:600}
.steps .tx span{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.steps li:not(.on):not(.now) .tx b{color:var(--muted);font-weight:500}

/* пузыри чата */
.chat-head{position:sticky;top:94px;z-index:20}
.date-pill{width:max-content;margin:12px auto 8px;background:rgba(31,41,51,.55);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:12px}
.bubble{background:#fff;border-radius:14px 14px 14px 4px;margin:0 12px 6px;padding:10px 12px;max-width:100%;box-shadow:0 1px 1px rgba(21,26,31,.12);font-size:15px}
.bubble .from{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:3px}
.bubble h3{margin:0 0 6px;font-size:16px;line-height:1.25}
.bubble .meta{color:var(--muted);font-size:12px;text-align:right;margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{margin:8px 0;padding:0;list-style:none;border-top:1px solid var(--line-soft)}
.pos li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px;line-height:1.3}
.pos li span:first-child{min-width:0;overflow-wrap:anywhere}
.pos li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 12px 10px}
.kb button{min-height:46px;border-radius:9px;background:rgba(31,41,51,.62);color:#fff;font-size:13.5px;font-weight:600;line-height:1.2;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center}
.kb button.next{background:var(--accent)}
.kb button.did{background:rgba(27,110,61,.82)}
.kb button[disabled]:not(.did){opacity:.55;cursor:not-allowed}
.kb .i{width:16px;height:16px;stroke-width:2.4}
.chip-s{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;white-space:nowrap}
.s0{background:var(--blue-soft);color:var(--blue)}
.s1{background:var(--amber-soft);color:var(--amber)}
.s2{background:var(--teal-soft);color:var(--teal)}
.s3{background:var(--green-soft);color:var(--green)}
.q{list-style:none;margin:6px 0 0;padding:0}
.q li button{display:grid;grid-template-columns:48px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line-soft);min-height:56px}
.q li:first-child button{border-top:0}
.q .tm{font-weight:700;font-variant-numeric:tabular-nums}
.q .cl{min-width:0;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.q .cl small{display:block;color:var(--muted);font-size:12.5px}
.q li.sel button{background:#f6f8fa;margin:0 -12px;padding-left:12px;padding-right:12px;width:calc(100% + 24px);border-radius:8px}
.q .mine{color:var(--accent);font-weight:700;font-size:12px}
.sub-h{font-size:12.5px;color:var(--muted);margin:2px 0 0}

/* владелец */
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:92px;margin:10px 0 0}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--steel-2)}
.bars div.pk i{background:var(--accent)}
.bars b{color:var(--ink);font-size:12px}
.ask{margin:6px 0 0;padding:0;list-style:none}
.ask li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:14px;line-height:1.3}
.ask li:first-child{border-top:0}
.ask li span:last-child{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.quote{margin:8px 0 0;font-size:14px;line-height:1.4}
.quote small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.quote+.quote{padding-top:8px;border-top:1px solid var(--line-soft)}
.cmp{display:grid;gap:6px;margin-top:10px}
.cmp div{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.cmp i{display:block;height:12px;border-radius:3px;background:var(--steel-2)}
.cmp div+div i{background:#aab4bf}
.cmp b{color:var(--ink);font-variant-numeric:tabular-nums}

/* итог */
.final{padding:28px 18px calc(28px + env(safe-area-inset-bottom));min-height:calc(100vh - 100px);display:flex;flex-direction:column}
.final h1{margin:0;font-size:30px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.final .lh{margin:14px 0 0;font-size:18px;line-height:1.4;text-wrap:pretty}
.final ul{margin:20px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.final li{display:flex;gap:10px;font-size:16px;line-height:1.35}
.final li .i{color:var(--green);margin-top:1px;stroke-width:2.4}
.sign{margin-top:auto;padding-top:28px}
.sign p{margin:0 0 14px;font-size:19px;line-height:1.5;font-weight:600}
.sign a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;display:inline-block;min-height:32px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:431px){.stage{margin-top:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M3.5 4.5h2.2l2 11h9.6l2-8H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-5.6 6.5-11a6.5 6.5 0 1 0-13 0c0 5.4 6.5 11 6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>

<script>
(function(){
'use strict';
const NB=' ', ITEMS=DATA.items, CATS=['Все'].concat(DATA.cats);

function group(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,NB)}
function money(n){const [a,b]=Math.abs(n).toFixed(2).split('.');return group(a)+','+b}
function num(n,d=2){let s=(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);if(s.includes('.'))s=s.replace(/\.?0+$/,'');const [a,b]=s.split('.');return group(a)+(b?','+b:'')}
const rub=n=>money(n)+NB+'р.';
const pf=v=>{const x=parseFloat(String(v).replace(',','.').replace(/\s/g,''));return isFinite(x)&&x>0?x:0};
const pad2=n=>String(n).padStart(2,'0');
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return (m>10&&m<20)?c:k===1?a:(k>=2&&k<=4)?b:c};

/* ---- поиск ---- */
const MAP={x:'х',a:'а',c:'с',e:'е',o:'о',p:'р',k:'к',m:'м',h:'н',t:'т',ё:'е'};
const norm=s=>s.toLowerCase().replace(/[xacepokmhtё]/g,c=>MAP[c]).replace(/,/g,'.');
ITEMS.forEach(i=>{i._h=norm(i.name+' '+i.spec+' '+i.cat);i._h2=i._h.replace(/\s/g,'')});
function match(i,q){return q.split(/\s+/).filter(Boolean).every(t=>i._h.includes(t)||i._h2.includes(t))}

/* ---- единицы ---- */
function sizeText(i){
  if(i.kind==='lin') return i.len?`хлыст ${num(i.len)}${NB}м`:'длина по запросу';
  const s=(i.size||'').replace(/х/g,'×');
  return `${i.unit} ${s}${/^\d+×\d+×\d+$/.test(s)?NB+'мм':NB+'м'}`;
}
function priceText(i){return {big:`${money(i.price)}${NB}р./${i.kind==='lin'?'м.п.':i.unit}`,
  small:i.kind==='lin'?`${money(i.price_t)}${NB}р./т`:(i.kind==='roll'?`${money(i.price_m2)}${NB}р./м²`:`${money(i.price_t)}${NB}р./т`)}}
const kgPerUnit=i=>i.price_t?i.price/i.price_t*1000:0;

/* ---- состояние ---- */
const now=new Date();
const S={role:'client',screen:'catalog',cat:'Все',q:'',shown:40,cart:[],sheet:null,
  mode:'pickup',pay:'erip',day:0,slot:null,name:'ИП Пример',phone:'+375 29 000-00-00',addr:'',
  orders:[],sel:null,myId:null,seq:16};
const HOLID=[];
function workDays(){
  const out=[];let d=new Date(now);d.setHours(0,0,0,0);
  const wd=x=>x.getDay()!==0&&x.getDay()!==6;
  let first=true;
  while(out.length<4){
    if(wd(d)&&!(first&&(now.getHours()>=15||!wd(now)))) out.push(new Date(d));
    first=false;d.setDate(d.getDate()+1);
  }
  const t0=new Date(now);t0.setHours(0,0,0,0);
  return out.map(x=>{const diff=Math.round((x-t0)/864e5);
    const w=['вс','пн','вт','ср','чт','пт','сб'][x.getDay()];
    const lab=diff===0?'Сегодня':diff===1?'Завтра':w;
    return {d:x,label:`${lab}, ${pad2(x.getDate())}.${pad2(x.getMonth()+1)}`,today:diff===0}});
}
function slotsFor(day){
  const out=[];for(let m=9*60;m<=16*60+30;m+=30){
    if(day.today&&m<=now.getHours()*60+now.getMinutes()+60) continue;
    out.push(pad2(Math.floor(m/60))+':'+pad2(m%60));}
  return out;
}
function ensureSlot(){const days=workDays();if(S.day>=days.length)S.day=0;const sl=slotsFor(days[S.day]);if(!sl.includes(S.slot))S.slot=sl.includes('14:00')?'14:00':sl[0]||null;}

/* ---- примеры заявок (вымышленные) ---- */
const find=(sub,n=0)=>ITEMS.filter(i=>i.name.includes(sub))[n]||ITEMS[0];
function mk(id,no,client,time,mode,pay,status,lines,extra){
  const items=lines.map(([it,q,meta])=>({id:it.id,q,meta:meta||'',sum:q*it.price}));
  return Object.assign({id,no,client,time,mode,pay,status,items,total:items.reduce((s,x)=>s+x.sum,0),ts:[],example:true},extra||{});
}
S.orders=[
  mk('o1','1109-011','ООО «Строй-Пример»','09:00','pickup','bez',3,[[find('Арматура А500С ф12мм'),240],[find('Арматура А500С ф10'),120]],{ts:['08:41','08:52','09:05','09:12']}),

];

/* ---- корзина ---- */
const cartSum=()=>S.cart.reduce((s,l)=>s+l.sum,0);
const cartQty=()=>S.cart.length;
function unitShort(i){return i.kind==='lin'?'м.п.':i.unit}
function lineText(l){const i=byId[l.id];return `${num(l.qty)}${NB}${unitShort(i)}`}

/* ---- шапка ---- */
function bar(title,sub,opts={}){

  ${opts.cart?`<button class="ib" data-act="cart" aria-label="Корзина">${ic('cart')}${cartQty()?`<span class="badge num">${cartQty()}</span>`:''}</button>`:''}</header>`;
}

/* ---- КЛИЕНТ: каталог ---- */
function catalogHTML(){
  const q=norm(S.q.trim());
  let list=ITEMS.filter(i=>(S.cat==='Все'||i.cat===S.cat)&&(!q||match(i,q)));
  const total=list.length;list=list.slice(0,S.shown);

  return `${bar('БАРСАвтоМет','Металлопрокат · мини-приложение',{cart:1})}
  <section class="lead"><h1>Металл без очереди</h1>

  <div style="height:${cnt?70:20}px"></div>

/* ---- КЛИЕНТ: калькулятор ---- */
function calc(sh){
  const i=byId[sh.id];const r={ok:false,rows:[],qty:0,sum:0,meta:'',err:''};
  const kg=kgPerUnit(i);
  if(i.kind==='lin'){
    let m=0,bars=null;
    if(sh.mode==='m'){m=pf(sh.m);if(i.len&&m)bars=Math.ceil(m/i.len-1e-9);
      r.rows.push(['Нужно',`${num(m)}${NB}м`]);
      if(bars!==null)r.rows.push(['Хлыстов',`${bars}${NB}шт × ${num(i.len)}${NB}м`]);
    }else{
      const size=pf(sh.size)/1000,cnt=Math.floor(pf(sh.cnt));
      if(size&&cnt){
        if(i.len){const per=Math.floor(i.len/size+1e-9);
          if(per<1){r.err=`Деталь ${num(size,3)} м длиннее хлыста ${num(i.len)} м.`;}
          else{bars=Math.ceil(cnt/per);m=size*cnt;
            r.rows.push(['Из хлыста',`${per}${NB}дет. по ${num(size*1000,0)}${NB}мм`]);
            r.rows.push(['Взять хлыстов',`${bars}${NB}шт`]);
            r.rows.push(['Отход',`${num(bars*i.len-m)}${NB}м`]);}
        }else{m=size*cnt;}
        r.rows.push(['Резаных деталей',`${cnt}${NB}шт = ${num(m)}${NB}м`]);
        r.meta=`резка ${num(size*1000,0)}${NB}мм × ${cnt}`;
      }
    }
    r.qty=m;
    if(m&&kg)r.rows.push(['Вес (расчётный)',`${num(m*kg,1)}${NB}кг`]);
  }else if(i.kind==='sheet'){
    const q=Math.floor(pf(sh.q));r.qty=q;
    r.rows.push(['Листов',`${q}${NB}шт`]);
    if(q&&kg)r.rows.push(['Вес (расчётный)',`${num(q*kg,1)}${NB}кг`]);
  }else{
    const q=Math.floor(pf(sh.q));r.qty=q;
    r.rows.push([i.unit==='рулон'?'Рулонов':'Листов',`${q}${NB}шт`]);
  }
  r.sum=r.qty*i.price;r.ok=r.qty>0&&!r.err;
  r.rows.push(['Сумма',rub(r.sum)]);
  return r;
}
function openSheet(id){

function sheetBody(sh){

    }else{

  }
  return h+`<div class="res num" id="res"></div><div id="resx"></div>`;
}
function renderSheet(){
  const sh=S.sheet;const layer=$('#layer');
  if(!sh){layer.innerHTML='';document.body.style.overflow='';return}

  document.body.style.overflow='hidden';
  layer.innerHTML=`<div class="scrim" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(i.name)}">

function updateCalc(){
  const sh=S.sheet;if(!sh)return;const r=calc(sh);
  $('#res').innerHTML=r.rows.map((x,k)=>`<div class="${k===r.rows.length-1?'tot':''}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
  $('#resx').innerHTML=r.err?`<div class="warn" role="alert">${r.err}</div>`:'';
  const b=$('#addbtn');b.disabled=!r.ok;
  b.innerHTML=r.ok?`${S.cart.some(x=>x.id===sh.id)?'Обновить':'В заказ'}<span class="sum">${rub(r.sum)}</span>`:'Укажите количество';
  b.className='btn'+(r.ok?' split':'');
}
function addLine(){
  const sh=S.sheet,r=calc(sh);if(!r.ok)return;
  const l={id:sh.id,qty:r.qty,sum:r.sum,meta:r.meta,sh:Object.assign({},sh)};
  const k=S.cart.findIndex(x=>x.id===sh.id);k>=0?S.cart[k]=l:S.cart.push(l);
  S.sheet=null;renderSheet();render();
}

    <p class="note">Слева – время на документы из отзыва, справа – пример того, что можно считать в сводке. Не обещание результата.</p>
    <div class="meta">17:30</div></div>
  <div style="padding:6px 12px 24px"><button class="btn" data-act="final">Как внедрить у вас</button></div>`;
}

/* ---- итог ---- */
function finalHTML(){
  return `<section class="final"><h1>Так может работать у вас.</h1>
  <p class="lh">Внедрение – 2–4 недели, дальше сопровождение.</p>
  <ul><li>${ic('check')}<span>Клиент собирает заказ в Telegram из вашего каталога и приезжает ко времени.</span></li>
  <li>${ic('check')}<span>Менеджер получает готовую карточку, а не диктует позиции по телефону.</span></li>
  <li>${ic('check')}<span>Вы каждый вечер видите заявки, суммы и то, чего не хватило на складе.</span></li></ul>
  <div class="sign"><p>Роман Благов<br><a href="https://t.me/blagov369">Telegram @blagov369</a><br><a href="tel:+375298611029" class="num">+375 29 861-10-29</a></p><button class="btn line" data-act="back-owner">${ic('back')}Вернуться к демо</button></div></section>`;
}

/* ---- рендер ---- */
function render(keepScroll){
  const app=$('#app');
  document.querySelectorAll('.roles button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.role===S.role&&S.screen!=='final')));
  app.classList.toggle('chat',S.role!=='client'&&S.screen!=='final');
  let h;
  if(S.screen==='final')h=finalHTML();
  else if(S.role==='client')h=S.screen==='cart'?cartHTML():S.screen==='done'?doneHTML():catalogHTML();
  else h=S.role==='staff'?staffHTML():ownerHTML();
  const y=window.scrollY;app.innerHTML=h;if(keepScroll)window.scrollTo(0,y);
  const q=$('#q');if(q&&S._fq){q.focus();q.setSelectionRange(q.value.length,q.value.length);S._fq=false}
}
function go(role,screen){S.role=role;if(screen)S.screen=screen;else if(S.screen==='final')S.screen='catalog';window.scrollTo(0,0);render()}

/* ---- события ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-role],[data-act]');if(!t)return;
  if(t.dataset.role){S.role=t.dataset.role;if(S.screen==='final')S.screen='catalog';window.scrollTo(0,0);render();return}
  const a=t.dataset.act,d=t.dataset;
  if(a==='closesheet'){if(e.target===t){S.sheet=null;renderSheet()}return}
  switch(a){
    case 'cat':S.cat=d.cat;S.shown=40;render(true);break;
    case 'more':S.shown+=40;render(true);break;
    case 'clearq':S.q='';S._fq=true;S.shown=40;render(true);break;
    case 'open':openSheet(+d.id);break;
    case 'cart':S.screen='cart';S.role='client';window.scrollTo(0,0);render();break;
    case 'catalog':S.screen='catalog';window.scrollTo(0,0);render();break;
    case 'rm':S.cart=S.cart.filter(l=>l.id!==+d.id);render(true);break;
    case 'smode':S.sheet.mode=d.v;renderSheet();break;
    case 'qm':S.sheet.m=d.v;{const f=$('#f-m');f.value=d.v}updateCalc();break;
    case 'qplus':case 'qminus':{const f=$('#f-q');let v=Math.floor(pf(f.value))+(a==='qplus'?1:-1);v=Math.max(1,v);f.value=v;S.sheet.q=String(v);S.sheet.len='';const l=$('#f-len');if(l)l.value='';updateCalc();break}
    case 'addline':addLine();break;
    case 'rmline':S.cart=S.cart.filter(l=>l.id!==S.sheet.id);S.sheet=null;renderSheet();render(true);break;
    case 'mode':S.mode=d.v;render(true);break;
    case 'day':S.day=+d.v;S.slot=null;render(true);break;
    case 'slot':S.slot=d.v;render(true);break;
    case 'pay':S.pay=d.v;render(true);break;
    case 'send':sendOrder();break;
    case 'newcart':S.cart=[];S.orders=S.orders.filter(o=>!o.mine);S.sel='o4';S.screen='catalog';window.scrollTo(0,0);render();break;
    case 'goto-staff':S.role='staff';S.sel='mine';window.scrollTo(0,0);render();break;
    case 'selo':S.sel=d.id;window.scrollTo(0,0);render();break;
    case 'step':{const o=S.orders.find(x=>x.id===S.sel),k=+d.k;if(o&&o.status===k-1){o.status=k;o.ts[k]=hhmm();render(true)}break}
    case 'final':S.screen='final';window.scrollTo(0,0);render();break;
    case 'back-owner':S.screen='catalog';S.role='owner';window.scrollTo(0,0);render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='q'){S.q=t.value;S.shown=40;S._fq=true;render(true)}
  else if(id==='f-m'){S.sheet.m=t.value;updateCalc()}
  else if(id==='f-size'){S.sheet.size=t.value;updateCalc()}
  else if(id==='f-cnt'){S.sheet.cnt=t.value;updateCalc()}
  else if(id==='f-q'){S.sheet.q=t.value;updateCalc()}
  else if(id==='f-len'){S.sheet.len=t.value;const L=+t.dataset.L,v=pf(t.value);if(v&&L){const r=Math.max(1,Math.ceil(v/L-1e-9));S.sheet.q=String(r);$('#f-q').value=r}updateCalc()}
  else if(id==='f-name')S.name=t.value;
  else if(id==='f-phone')S.phone=t.value;
  else if(id==='f-addr')S.addr=t.value;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
const setTop=()=>document.documentElement.style.setProperty('--top',$('.top').offsetHeight+'px');setTop();addEventListener('resize',setTop);
render();
})();
</script>
</body>
